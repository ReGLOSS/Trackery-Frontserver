<!doctype html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="/register/css/register.css" type="text/css">
    <link rel="stylesheet" href="/css/tabler.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
</head>
<body>
<!-- 모달 창 -->
<div class="modal-content">
    <span class="modal-close" onClick="closeModal()">&times;</span>

    <!-- 1. 제목 섹션 -->
    <div class="title-section">회원가입</div>

    <!-- 2. 프로필 이미지 섹션 -->
    <div class="profile-image-section">
        <img src="/register/images/profile.jpg" alt="프로필 이미지" class="profile-image">
    </div>

    <!-- 3. 입력 섹션 -->
    <div class="input-form-section">

        <div class="email-input-section" style="margin-bottom: 20px">
            <label class="form-label required">이메일</label>
            <div class="email-input-form">
                <input type="text" class="form-control" id="email" name="email" style="height: 50px"
                       placeholder="이메일을 입력해주세요."/>
                <div class="email-verify-btn">
                    <a href="#" class="btn btn-dark w-100" style="height: 50px">이메일 인증(미구현)</a>
                </div>
            </div>
        </div>

        <div class="username-input-section" style="margin-bottom: 20px">
            <div class="mb-0 d-flex align-items-baseline">
                <label class="form-label required">사용자명</label>
                <small class="form-text text-muted">&nbsp&nbsp 4~15자 길이에 영문 대소문자, 숫자, 밑줄(_)로 작성해주세요.</small>
            </div>
            <div class="username-input-form">
                          <span class="input-group-text">
                              @
                            </span>
                <input type="text" class="form-control" id="username" name="username" style="height: 50px;"
                       placeholder="사용자명을 입력해주세요." autocomplete="off"/>
                <div class="username-verify-btn">
                    <a href="#" id="username-verify-btn" class="btn btn-dark w-100 disabled" style="height: 50px">&nbsp&nbsp중복
                        확인&nbsp&nbsp</a>
                </div>
            </div>
        </div>

        <div class="nickname-input-form" style="margin-bottom: 20px;">
            <label class="form-label required">닉네임</label>
            <input type="text" class="form-control" id="nickname" name="nickname" style="height: 50px;"
                   placeholder="닉네임을 입력해주세요."/>
        </div>

        <div class="password-input-form" style="margin-bottom: 20px;">
            <div class="mb-0 d-flex align-items-baseline">
                <label class="form-label required">비밀번호</label>
                <small class="form-text text-muted">&nbsp&nbsp 최소 16자리에 영문 대소문자 + 숫자 + 특수문자로 작성해주세요.</small>
            </div>
            <input type="text" class="form-control" id="password" name="password" style="height: 50px;"
                   placeholder="비밀번호를 입력해주세요."/>
        </div>

        <div class="password-confirm-input-form" style="margin-bottom: 20px;">
            <label class="form-label required">비밀번호 확인</label>
            <input type="text" class="form-control" id="password-confirm" name="password-confirm"
                   style="height: 50px;"
                   placeholder="비밀번호를 다시 입력해주세요."/>
        </div>

        <div class="prefered-location-input-form">
            <label class="form-label required">선호 지역</label>
            <input type="text" class="form-control" id="prefered-location" name="prefered-location"
                   style="height: 50px;" placeholder="선호지역(미구현)"/>
        </div>

    </div>

    <!-- 4. 간편 로그인 섹션 -->
    <div class="oauth-register-section">
        <div class="oauth-title"> 간편 로그인 가입</div>

        <div class="provider-logos">
            <img src="/register/images/naver-logo.png" class="naver-logo" alt="네이버로 간편로그인">
            <img src="/register/images/kakao-logo.png" class="kakao-logo" alt="카카오로 간편로그인">
            <img src="/register/images/google-logo.png" class="google-logo" alt="구글로 간편로그인">
        </div>
    </div>

    <!-- 저장 버튼 섹션 -->
    <div class="save-section">
        <div class="save-btn">
            <a href="#" id="save-btn" class="btn btn-dark btn-lg w-100 disabled">변경 사항 저장</a>
        </div>
    </div>

</div>
</body>
</html>
