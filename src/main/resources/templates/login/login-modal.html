<!doctype html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="/login/css/login.css" type="text/css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>login-modal</title>
</head>
<body>
<div class="modal-content">
    <!-- 타이틀 섹션 -->
    <p class="title">로그인</p>
    <!-- 입력폼 섹션 -->
    <div class="input-form">
        <form>
            <div class="mb-3">
                <input type="text" class="form-control" placeholder="유저명">
            </div>
            <div class="mb-3">
                <div class="input-group input-group-flat">
                    <input type="password" class="form-control" autocomplete="off" placeholder="비밀번호" />
                    <span class="input-group-text">
                        <a href="#" class="input-group-link">비밀번호 표시</a>
                    </span>
                </div>
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-dark w-100 mb-2">로그인</button>
            </div>
        </form>

        <div class="account-action">
            <a href="#" class="text-muted">계정을 잃어버리셨나요?</a>
            <a href="#" class="text-muted">아직 회원이 아니신가요?</a>
        </div>
    </div>
    <hr>
    <!-- 간편 로그인 섹션 -->
    <div class="oauth-login mb-3">
        <p class="oauth-title" >소셜 로그인</p>
        <div class="oauth-providers">
            <img src="/images/google-logo.png" class="oauth-icon" alt="구글 로그인">
            <img src="/images/kakao-logo.png" class="oauth-icon" alt="카카오 로그인">
            <img src="/images/naver-logo.png" class="oauth-icon" alt="네이버 로그인">
        </div>
    </div>

</div>

</body>
</html>
