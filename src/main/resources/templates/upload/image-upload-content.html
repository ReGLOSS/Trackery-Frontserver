<!DOCTYPE html>
<html
        lang="ko"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{common/layout}">
<head>
    <title>Trackery - 이미지 업로드</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/l10n/ko.min.js"></script>
    <link rel="stylesheet" href="/upload/css/image-upload.css">
    <link rel="stylesheet" href="/upload/css/processing-indicator.css">
    <link th:replace="~{map/map-picker-modal :: mapPickerModalCss}">
    <script th:replace="~{map/map-picker-modal :: kostatMapScript}"></script>
</head>
<body>
<section layout:fragment="content" class="image-upload-container">
    <!--업로드 중 모달-->
    <div class="while-uploading-modal">
        <div class="uploading-modal-container">
            <div id="uploadingBlock" class="uploading-modal-block">
                <div class="spinner-border"></div>
                이미지를 업로드하는 중입니다. 잠시만 기다려주세요...
            </div>

            <div id="resultInfoBlock" class="uploading-modal-block">
                <p id="uploadedImageCount">N장의 이미지를 성공적으로 업로드했습니다.</p>

                <div id="failedUploadInfoGroup">
                    <p id="uploadFailedImageCount">N장의 이미지는 업로드에 실패했습니다.</p>
                    <p class="text-muted upload-failed-gallery-label">업로드에 실패한 이미지</p>
                    <div id="uploadingModalGallery" class="uploading-modal-gallery"></div>
                </div>
            </div>
        </div>
    </div>

    <!--  메인탭-->
    <div class="base-container">
        <div class="gallery">
            <div class="add-image">
                <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
                <img src="/upload/icon/image-upload.svg" alt="image-add" class="image-add">
            </div>
        </div>

        <div class="upload-button-container">
            <button class="btn btn-dark" id="imageUploadBtn">이미지 업로드</button>
        </div>
    </div>
    <!--  이미지 첨부 모달-->
    <div class="image-select-modal" id="imageSelectModal" style="display: none;">
        <div class="modal-overlay" id="imageSelectModalOverlay"></div>
        <div class="image-select-container">
            <div class="image-select-header">
                <h3>이미지 선택</h3>
                <button class="modal-close-btn" id="imageSelectModalClose">&times;</button>
            </div>
            <div class="image-select-body">
                <div class="dropzone-area" id="dropzoneArea">
                    <div class="dropzone-content">
                        <h4>이미지를 드래그하여 업로드하세요.</h4>
                        <p>또는 <button class="browse-btn" id="browseBtn">파일 선택</button>하여 이미지를 추가할 수 있습니다.</p>
                        <small>최대 20개의 JPG, PNG, WebP 파일만 지원됩니다. (최대 30MB)</small>
                    </div>
                </div>
                <div class="selected-files" id="selectedFiles" style="display: none;">
                    <h4>선택된 파일</h4>
                    <div class="file-gallery" id="fileGallery"></div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" id="cancelBtn">취소</button>
                        <button class="btn btn-primary" id="addFilesBtn">파일 추가</button>
                    </div>
                </div>
            </div>
            <input type="file" id="modalFileInput" accept="image/*" multiple style="display: none;">
        </div>
    </div>

    <!--  우측 사이드 모달-->
    <div class="detail-modal" id="detailModal" style="display: none;">
        <div class="modal-overlay" id="detailModalOverlay"></div>
        <div class="detail-container">
            <div class="modal-body">
                <div class="image-not-selected">
                    <p>사진을 선택하면 <br> 추가 정보를 기입할 수 있습니다.</p>
                </div>
                <div class="image-selected">
                    <div class="image-container">
                          <img src="/images/default-image4.webp" class="image-detail" alt="선택된 이미지">
                    </div>

                    <div class="description-area">
                        <label for="modalDescription">설명</label>
                        <textarea id="modalDescription" class="form-control" rows="5"
                        placeholder="여기에 설명을 입력하세요. (이미지 설명은 500자를 초과할 수 없습니다.)"
                                  style="resize:none;"></textarea>
                    </div>

                    <div class="tag-area">
                        <label>태그</label>
                        <div class="tag-box" id="modalTagBox">
                            <input type="text" class="tag-input" placeholder="태그 입력 후 Enter" style="display: none;">
                            <button class="tag-add">+</button>
                        </div>
                    </div>

                    <div class="location-area">
                        <div class="location-box">
                            <label for="modalLocationBox">위치</label>
                                <a href="#" class="text-muted" id="modalEditLocationBtn">여기가 아닌가요?</a>
                                    <input id="modalLocationBox" class="form-control" type="text" value="" readonly/>
                        </div>
                    </div>

                    <div th:replace="~{map/map-picker-modal :: mapPickerModal(title, 'mapPickerModal')}"></div>

                    <div class="date-area">
                        <div class="date-box">
                            <label for="modalDateBox">날짜</label>
                                <a href="#" class="text-muted" id="modalEditDateBtn">다른 날 다녀오셨나요?</a>
                                    <input id="modalDateBox" class="form-control" type="text" value="" readonly/>
                        </div>
                    </div>

                    <div class="public-area">
                        <label for="modalPublic">
                            이 사진을 공개 할까요?
                            <input type="checkbox" id="modalPublic"/>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div layout:fragment="scripts">
    <script src="/common/js/exif-js/exif.js"></script>
    <script type="module" src="/upload/js/imageUploadV2.js"></script>
    <script th:replace="~{map/map-picker-modal :: mapPickerModalJs}"></script>
</div>
</body>
</html>
