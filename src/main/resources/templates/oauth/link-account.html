<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 연동 확인</title>
    <link rel="stylesheet" href="/login/css/login.css" type="text/css">
    <style>
      body {
          font-family: Arial, sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
          background-color: #2a2a36;
      }
      .container {
          border-radius: 7px;
          position: relative;
          padding: 2%;
          background-color: #d3d9e8;
          max-width: 50vh;
          text-align: center;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .btn {
          padding: 10px 20px;
          margin: 10px;
          background-color: #2a2a36;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          text-decoration: none;
      }
      .btn-secondary {
          background-color: #71717c;
      }
      .btn:hover {
          opacity: 0.9;
      }
      #error-message {
          color: #dc3545;
          margin-top: 1rem;
      }
      .success-message {
          color: #28a745;
          font-weight: bold;
          margin-bottom: 10px;
      }
      .spinner {
          border: 4px solid rgba(0, 0, 0, 0.1);
          width: 36px;
          height: 36px;
          border-radius: 50%;
          border-left-color: #007bff;
          animation: spin 1s linear infinite;
          margin: 10px auto;
      }
      .title {
          margin-bottom: 20px;
          text-align: center;
          font-size: 28px;
          font-weight: bold;
      }
      @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
      }
</style>
</head>
<body>
   <div class="container">
        <h2>이미 가입된 이메일입니다</h2>
        <p>소셜 로그인으로 입력한 이메일은 이미 Trackery에 가입되어 있습니다.</p>
        <p th:if="${email != null && email != ''}" th:text="'이메일: ' + ${email}"></p>
        <p>기존 계정과 소셜 계정을 연동하시겠습니까?</p>

<div id="buttons">
    <form method="post" action="/oauth-account/link">
        <input type="hidden" name="provider" th:value="${provider}">
        <button type="submit" class="btn">계정 연동하기</button>
        <a href="/" class="btn btn-secondary">취소</a>
    </form>
</div>

<div id="loading" style="display: none;">
    <p>처리 중입니다...</p>
    <div class="spinner"></div>
</div>
</div>
<script>
    document.querySelector('form').addEventListener('submit', function() {
        document.getElementById('buttons').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
    });

    // 취소 버튼에 이벤트 리스너 추가
    document.querySelector('.btn-secondary').addEventListener('click', function(e) {
        e.preventDefault();

        // 부모 창이 있는 경우 메시지 전송
        if (window.opener) {
            window.opener.postMessage({ oauthCancelled: true }, window.location.origin);
            window.close();
        } else {
            // 일반 창인 경우 홈으로 리다이렉트
            window.location.href = '/';
        }
    });
</script>
</body>
</html>
