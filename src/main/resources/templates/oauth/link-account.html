<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 연동 확인</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }
        .container {
            text-align: center;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: white;
            max-width: 500px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn:hover {
            opacity: 0.9;
        }
        #error-message {
            color: #dc3545;
            margin-top: 1rem;
        }
        .success-message {
            color: #28a745;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
   <div class="container">
        <h2>이미 가입된 이메일입니다</h2>
        <p>소셜 로그인으로 입력한 이메일은 이미 Trackery에 가입되어 있습니다.</p>
        <p th:if="${email != null && email != ''}" th:text="'이메일: ' + ${email}"></p>
        <p>기존 계정과 소셜 계정을 연동하시겠습니까?</p>
        </div>

<div id="buttons">
    <form method="post" action="/oauth-account/link">
        <input type="hidden" name="provider" th:value="${provider}">
        <button type="submit" class="btn">계정 연동하기</button>
        <a href="/" class="btn btn-secondary">취소</a>
    </form>
</div>

<div id="loading" style="display: none;">
    <p>처리 중입니다...</p>
    <div class="spinner"></div>
</div>

<script>
    document.querySelector('form').addEventListener('submit', function() {
        document.getElementById('buttons').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
    });
</script>
</body>
</html>
