<!DOCTYPE html>
<html
        lang="ko"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{common/layout}">
<head>
    <title>Trackery - Home</title>
    <link rel="stylesheet" href="/home/css/home.css" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/l10n/ko.min.js"></script>
    <link th:replace="~{map/map-picker-modal :: mapPickerModalCss}">
    <script th:replace="~{map/map-picker-modal :: proj4jsLib}"></script>
    <script th:replace="~{map/map-picker-modal :: kostatMapScript}"></script>
</head>
<body>
<section layout:fragment="content" class="home-container">
    <div class="base-container">
        <div class="map-container">
            <div class="map-header">
                <h2 class="map-title" id="map-title"></h2>
                <img id="back-btn" src="/icons/common/up.svg" alt="돌아가기">
            </div>
            <div id="map-display" class="map-display">
                <!-- SVG maps will be loaded here -->
            </div>
        </div>
    </div>
    <div class="detail-container">
    </div>
    
    <!-- 이미지 상세 보기 모달 -->
    <div class="image-detail-modal" id="imageDetailModal" style="display: none;">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="image-selected">
                    <div class="image-container">
                        <img src="/images/default-image4.webp" class="image-detail" alt="선택된 이미지" id="modalImage">
                    </div>

                    <div class="description-area">
                        <label for="modalDescription">설명</label>
                        <textarea id="modalDescription" class="form-control" rows="5" placeholder="여기에 설명을 입력하세요..."
                                  style="resize:none;" readonly></textarea>
                    </div>

                    <div class="tag-area">
                        <label>태그</label>
                        <div class="tag-box" id="modalTagBox">
                            <!-- 태그들이 동적으로 추가됩니다 -->
                        </div>
                    </div>

                    <div class="location-area">
                        <label for="modalLocationBox">위치</label>
                        <div class="location-box">
                            <a href="#" class="text-muted" id="modalEditLocationBtn" style="display: none;">여기가 아닌가요?</a>
                            <input id="modalLocationBox" class="form-control" type="text" value="" readonly/>
                        </div>
                    </div>

                    <div class="date-area">
                        <label for="modalDateBox">날짜</label>
                        <div class="date-box">
                            <a href="#" class="text-muted" id="modalEditDateBtn" style="display: none;">다른 날 다녀오셨나요?</a>
                            <input id="modalDateBox" class="form-control" type="text" value="" readonly/>
                        </div>
                    </div>

                    <div class="public-area">
                        <label>공개 설정</label>
                        <div class="public-status" id="modalPublicStatus">비공개</div>
                        <div class="checkbox-area" id="modalPublicCheckboxArea" style="display: none;">
                            <label for="modalPublic">
                                공개 사진
                                <input type="checkbox" id="modalPublic"/>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="modalEditBtn">수정</button>
                <button class="btn btn-danger" id="modalDeleteBtn" style="display: none;">삭제</button>
                <button class="btn btn-secondary" id="modalCancelEditBtn" style="display: none;">취소</button>
                <button class="btn btn-success" id="modalSaveBtn" style="display: none;">저장</button>
            </div>
        </div>
    </div>
    
    <!-- Map Picker Modal -->
    <div th:replace="~{map/map-picker-modal :: mapPickerModal('위치 선택', 'modalMapPickerModal')}"></div>
</section>
<div layout:fragment="scripts">
    <script th:replace="~{map/map-picker-modal :: mapPickerModalJs}"></script>
    <script type="module" src="/home/js/home.js"></script>
</div>
</body>
</html>
