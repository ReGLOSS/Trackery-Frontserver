<!DOCTYPE html>
<html
        lang="ko"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{common/layout}">
<head>
    <title>Trackery - Home</title>
    <link rel="stylesheet" href="/home/css/home.css" type="text/css">
</head>
<body>
<section layout:fragment="content" class="home-container">
    <div class="base-container">
        <div class="map-container">
            <div class="map-header">
                <h2 id="map-title"></h2>
                <img id="back-btn" src="/icons/common/up.svg" alt="돌아가기"
                style="display: none; width: 100px; height: 100px; cursor: pointer;">
            </div>
            <div id="map-display" class="map-display">
                <!-- SVG maps will be loaded here -->
            </div>
        </div>
    </div>
    <div class="detail-container">
</div>
</section>
<div layout:fragment="scripts">
    <script src="/home/js/map.js"></script>
</div>
</body>
</html>
