<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="sidebar" class="sidebar">
  <aside class="navbar navbar-vertical navbar-expand-lg">
    <div class="container-fluid">
      <div class="navbar-brand">
        <a href="#">
          <img
            src="/icons/common/map-pin.svg"
            class="navbar-brand-image"
            alt="Trackery"/>
        </a>
      </div>
      <div class="collapse navbar-collapse" id="sidebar-menu">
        <ul class="navbar-nav pt-lg-3">
          <li class="nav-item">
            <a class="nav-link" href="./">
              <span class="nav-link-map"> 지도 </span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">
              <span class="nav-link-album"> 앨범 </span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">
              <span class="nav-link-moim"> MOIM </span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">
              <span class="nav-link-push"> 알림 </span>
            </a>
          </li>
        </ul>
      </div>

     <!-- 업로드 버튼 -->
     <div class="mt-auto mb-3 px-3">
        <button id="photoUploadBtn" class="btn btn-primary btn-pill w-100">
          사진 업로드
        </button>
     </div>

     <!-- 사용자 프로필 -->
     <div class="user-profile d-flex align-items-center p-2 border-top">
       <div class="avatar me-3">
         <img
           th:src="${userProfile != null && userProfile.userProfile != null ? userProfile.userProfile : '/images/profile.jpg'}"
           class="rounded-circle"
           width="40"
           height="40"
           alt="사용자 아바타">
       </div>
       <div class="user-info">
         <p class="m-0 fw-bold" th:text="${userProfile != null ? userProfile.nickname : '유저명'}">유저명</p>
         <p class="m-0 text-muted small" th:text="${userProfile != null ? '@' + userProfile.userName : '@USER'}">@USER</p>
       </div>
     </div>
   </div>
  </aside>
</div>
