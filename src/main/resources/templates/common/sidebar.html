<!DOCTYPE html>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar" class="sidebar">
    <div class="navbar navbar-vertical navbar-expand-lg">
        <div class="container-fluid">
            <div class="navbar-brand">
                <a href="#">
                    <img
                            src="/icons/common/map-pin.svg"
                            class="navbar-brand-image"
                            alt="Trackery"/>
                </a>
            </div>
            <div class="navbar-custom" id="sidebar-menu">
                <ul class="navbar-nav pt-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" href="./">
                            <span class="nav-link-map"> 지도 </span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <span class="nav-link-album"> 앨범 </span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <span class="nav-link-moim"> MOIM </span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <span class="nav-link-push"> 알림 </span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- 업로드 버튼 -->
            <div class="photo-upload-btn">
                <button id="photoUploadBtn" class="btn btn-primary btn-pill w-100">
                    사진 업로드
                </button>
            </div>

            <!-- 사용자 프로필 -->
            <div class="user-profile text-center">
                <div class="mx-auto mb-2">
                    <img
                            th:src="${userProfile != null && userProfile.userProfile != null ?
                      userProfile.userProfile : '/images/profile.jpg'}"
                            class="rounded-circle user-avatar"
                            alt="사용자 아바타"
                            onerror="this.src='/images/profile.jpg'">
                </div>
                <div class="user-info">
                    <p class="m-0 fw-bold text-white" th:text="${userProfile != null ? userProfile.nickname : '유저명'}">
                        유저명</p>
                    <p class="m-0 fw-bold text-muted"
                       th:text="${userProfile != null ? '@' + userProfile.userName : '@USER'}">@USER</p>
                </div>
            </div>
        </div>
    </div>
</div>
