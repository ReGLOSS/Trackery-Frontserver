<!DOCTYPE html>
<html
        lang="ko"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{common/layout}">
<head>
    <title>Trackery - 앨범</title>
    <link rel="stylesheet" href="/album/css/album.css">
</head>
<body>
<section layout:fragment="content" class="album-container">
    <!--  메인탭-->
    <div class="base-container">
        <!-- 아직 앨범이 없을 때 보일 화면-->
        <div class="no-album-container div-section">
            <a>아직 앨범이 없습니다. Trackery에서 첫 앨범을 만들어보세요 ㅇㅇ;</a>
            <br>
            <button class="btn btn-dark big-album-create-btn">앨범 만들기</button>
        </div>

        <!-- 앨범이 있을 때 보일 화면 -->
        <div class="album-exists-container div-section">
<!--            선택창-->
            <div class="album-nav-container div-section">
                <div class="album-visiblity-btn-group">

                </div>

                <button class="btn btn-dark small-album-create-btn"></button>

            </div>

            <!--            앨범 갤러리-->
            <div class="album-gallery">
               <div class="album-card">
                   <a>
                       <img src="/images/default-image1.webp" alt="album-image">
                   </a>
                   <p class="card-album-title">
                       광주 여행
                   </p>

                   <p class="text-muted card-album-image-count">
                       항목 : 18장
                   </p>
               </div>
            </div>
        </div>
    </div>
    <!--  우측 사이드탭-->
    <div class="detail-container">
    </div>
</section>
<div layout:fragment="scripts">
    <script type="module" src="/album/js/Album.js"></script>
</div>
</body>
</html>
